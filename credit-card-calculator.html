<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Card Payoff Calculator Australia | AusFinanceHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; line-height: 1.6; color: #0f172a; background: #f8fafc; margin: 0; padding: 40px 20px; }
        .container { max-width: 700px; margin: 0 auto; background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        h1 { color: #0a192f; font-size: 2rem; margin-bottom: 10px; }
        p { color: #64748b; margin-bottom: 30px; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #0052cc; text-decoration: none; font-weight: 700; }
        
        .calc-group { margin-bottom: 20px; }
        .calc-group label { display: block; font-weight: 700; margin-bottom: 8px; color: #0a192f; }
        .calc-group input { width: 100%; padding: 12px 16px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 1rem; box-sizing: border-box; outline: none; }
        .calc-group input:focus { border-color: #0052cc; }

        .btn-calc { width: 100%; background: #0052cc; color: white; border: none; padding: 14px; border-radius: 10px; font-size: 1rem; font-weight: 800; cursor: pointer; margin-top: 10px; }
        .btn-calc:hover { background: #0043a8; }

        .result-box { margin-top: 30px; background: #fef3c7; padding: 24px; border-radius: 12px; border: 1px solid #fcd34d; display: none; }
        .result-item { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 1.05rem; }
        .result-item strong { color: #b45309; font-size: 1.2rem; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">&larr; Back to AusFinanceHub</a>
        <h1>Credit Card Payoff Calculator</h1>
        <p>Calculate how long it will take to pay off your credit card balance and how much interest you will pay.</p>

        <div class="calc-group">
            <label>Card Balance ($ AUD):</label>
            <input type="number" id="cardBalance" placeholder="e.g. 5000" value="5000">
        </div>

        <div class="calc-group">
            <label>Interest Rate (% p.a.):</label>
            <input type="number" step="0.01" id="cardRate" placeholder="e.g. 19.99" value="19.99">
        </div>

        <div class="calc-group">
            <label>Planned Monthly Payment ($ AUD):</label>
            <input type="number" id="monthlyPayment" placeholder="e.g. 200" value="200">
        </div>

        <button class="btn-calc" onclick="calculateCreditCard()">Calculate Payoff Time</button>

        <div class="result-box" id="resultBox">
            <div class="result-item">
                <span>Time to Pay Off:</span>
                <strong id="payoffTime">0 Months</strong>
            </div>
            <div class="result-item">
                <span>Total Interest Paid:</span>
                <span id="cardInterest" style="font-weight:700;">$0.00</span>
            </div>
            <div class="result-item">
                <span>Total Amount Paid:</span>
                <span id="cardTotal" style="font-weight:700;">$0.00</span>
            </div>
        </div>
    </div>

    <script>
        function calculateCreditCard() {
            let balance = parseFloat(document.getElementById('cardBalance').value);
            let annualRate = parseFloat(document.getElementById('cardRate').value);
            let payment = parseFloat(document.getElementById('monthlyPayment').value);

            if (!balance || !annualRate || !payment) {
                alert("Please enter valid details.");
                return;
            }

            let monthlyRate = (annualRate / 100) / 12;
            let months = 0;
            let totalInterest = 0;

            if (payment <= balance * monthlyRate) {
                alert("Monthly payment is too low to cover the monthly interest. Increase your monthly payment!");
                return;
            }

            while (balance > 0) {
                let interest = balance * monthlyRate;
                totalInterest += interest;
                balance = balance + interest - payment;
                months++;
                if (months > 600) break; // Prevent infinite loop
            }

            let totalPaid = parseFloat(document.getElementById('cardBalance').value) + totalInterest;

            document.getElementById('payoffTime').innerText = months + " Months (" + (months / 12).toFixed(1) + " Years)";
            document.getElementById('cardInterest').innerText = '$' + totalInterest.toFixed(2);
            document.getElementById('cardTotal').innerText = '$' + totalPaid.toFixed(2);

            document.getElementById('resultBox').style.display = 'block';
        }
    </script>
</body>
</html>
