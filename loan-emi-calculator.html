<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan EMI & Repayment Calculator Australia | AusFinanceHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; line-height: 1.6; color: #0f172a; background: #f8fafc; margin: 0; padding: 40px 20px; }
        .container { max-width: 700px; margin: 0 auto; background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        h1 { color: #0a192f; font-size: 2rem; margin-bottom: 10px; }
        p { color: #64748b; margin-bottom: 30px; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #0052cc; text-decoration: none; font-weight: 700; }
        
        .calc-group { margin-bottom: 20px; }
        .calc-group label { display: block; font-weight: 700; margin-bottom: 8px; color: #0a192f; }
        .calc-group input { width: 100%; padding: 12px 16px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 1rem; box-sizing: border-box; outline: none; }
        .calc-group input:focus { border-color: #0052cc; }

        .btn-calc { width: 100%; background: #00875a; color: white; border: none; padding: 14px; border-radius: 10px; font-size: 1rem; font-weight: 800; cursor: pointer; margin-top: 10px; }
        .btn-calc:hover { background: #006644; }

        .result-box { margin-top: 30px; background: #e0e7ff; padding: 24px; border-radius: 12px; border: 1px solid #c7d2fe; display: none; }
        .result-item { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 1.05rem; }
        .result-item strong { color: #0052cc; font-size: 1.2rem; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">&larr; Back to AusFinanceHub</a>
        <h1>Loan EMI Repayment Calculator</h1>
        <p>Calculate your estimated monthly repayments, total interest payable, and overall cost of borrowing in Australia.</p>

        <div class="calc-group">
            <label>Loan Amount ($ AUD):</label>
            <input type="number" id="loanAmount" placeholder="e.g. 30000" value="30000">
        </div>

        <div class="calc-group">
            <label>Interest Rate (% p.a.):</label>
            <input type="number" step="0.01" id="interestRate" placeholder="e.g. 6.5" value="6.5">
        </div>

        <div class="calc-group">
            <label>Loan Term (Years):</label>
            <input type="number" id="loanTerm" placeholder="e.g. 5" value="5">
        </div>

        <button class="btn-calc" onclick="calculateEMI()">Calculate Monthly EMI</button>

        <div class="result-box" id="resultBox">
            <div class="result-item">
                <span>Monthly Repayment:</span>
                <strong id="monthlyEmi">$0.00</strong>
            </div>
            <div class="result-item">
                <span>Total Interest Payable:</span>
                <span id="totalInterest" style="font-weight:700;">$0.00</span>
            </div>
            <div class="result-item">
                <span>Total Loan Cost (Principal + Interest):</span>
                <span id="totalPayable" style="font-weight:700;">$0.00</span>
            </div>
        </div>
    </div>

    <script>
        function calculateEMI() {
            let P = parseFloat(document.getElementById('loanAmount').value);
            let annualRate = parseFloat(document.getElementById('interestRate').value);
            let years = parseFloat(document.getElementById('loanTerm').value);

            if (!P || !annualRate || !years) {
                alert("Please fill in all details correctly.");
                return;
            }

            let r = (annualRate / 100) / 12;
            let n = years * 12;

            let emi = (P * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
            let totalPayment = emi * n;
            let totalInterest = totalPayment - P;

            document.getElementById('monthlyEmi').innerText = '$' + emi.toFixed(2);
            document.getElementById('totalInterest').innerText = '$' + totalInterest.toFixed(2);
            document.getElementById('totalPayable').innerText = '$' + totalPayment.toFixed(2);

            document.getElementById('resultBox').style.display = 'block';
        }
    </script>
</body>
</html>
