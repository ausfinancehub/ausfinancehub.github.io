<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savings & Interest Calculator Australia | AusFinanceHub</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; line-height: 1.6; color: #0f172a; background: #f8fafc; margin: 0; padding: 40px 20px; }
        .container { max-width: 700px; margin: 0 auto; background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        h1 { color: #0a192f; font-size: 2rem; margin-bottom: 10px; }
        p { color: #64748b; margin-bottom: 30px; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #0052cc; text-decoration: none; font-weight: 700; }
        
        .calc-group { margin-bottom: 20px; }
        .calc-group label { display: block; font-weight: 700; margin-bottom: 8px; color: #0a192f; }
        .calc-group input { width: 100%; padding: 12px 16px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 1rem; box-sizing: border-box; outline: none; }
        .calc-group input:focus { border-color: #0052cc; }

        .btn-calc { width: 100%; background: #0052cc; color: white; border: none; padding: 14px; border-radius: 10px; font-size: 1rem; font-weight: 800; cursor: pointer; margin-top: 10px; }
        .btn-calc:hover { background: #0043a8; }

        .result-box { margin-top: 30px; background: #dcfce7; padding: 24px; border-radius: 12px; border: 1px solid #86efac; display: none; }
        .result-item { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 1.05rem; }
        .result-item strong { color: #00875a; font-size: 1.3rem; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">&larr; Back to AusFinanceHub</a>
        <h1>Compound Savings Calculator</h1>
        <p>Calculate how much your high-interest savings account can grow over time with compound interest in Australia.</p>

        <div class="calc-group">
            <label>Initial Deposit ($ AUD):</label>
            <input type="number" id="initialDeposit" placeholder="e.g. 5000" value="5000">
        </div>

        <div class="calc-group">
            <label>Monthly Contribution ($ AUD):</label>
            <input type="number" id="monthlyDeposit" placeholder="e.g. 500" value="500">
        </div>

        <div class="calc-group">
            <label>Annual Interest Rate (% p.a.):</label>
            <input type="number" step="0.01" id="interestRate" placeholder="e.g. 5.25" value="5.25">
        </div>

        <div class="calc-group">
            <label>Savings Period (Years):</label>
            <input type="number" id="savingsYears" placeholder="e.g. 3" value="3">
        </div>

        <button class="btn-calc" onclick="calculateSavings()">Calculate Total Savings</button>

        <div class="result-box" id="resultBox">
            <div class="result-item">
                <span>Estimated Future Balance:</span>
                <strong id="futureBalance">$0.00</strong>
            </div>
            <div class="result-item">
                <span>Total Principal Deposited:</span>
                <span id="totalDeposits" style="font-weight:700;">$0.00</span>
            </div>
            <div class="result-item">
                <span>Total Interest Earned:</span>
                <span id="totalInterest" style="font-weight:700;">$0.00</span>
            </div>
        </div>
    </div>

    <script>
        function calculateSavings() {
            let P = parseFloat(document.getElementById('initialDeposit').value) || 0;
            let PMT = parseFloat(document.getElementById('monthlyDeposit').value) || 0;
            let annualRate = parseFloat(document.getElementById('interestRate').value) || 0;
            let years = parseFloat(document.getElementById('savingsYears').value) || 0;

            let r = (annualRate / 100) / 12;
            let n = years * 12;

            let futureBalance = P * Math.pow(1 + r, n);
            for (let i = 1; i <= n; i++) {
                futureBalance += PMT * Math.pow(1 + r, n - i);
            }

            let totalDeposits = P + (PMT * n);
            let totalInterest = futureBalance - totalDeposits;

            document.getElementById('futureBalance').innerText = '$' + futureBalance.toFixed(2);
            document.getElementById('totalDeposits').innerText = '$' + totalDeposits.toFixed(2);
            document.getElementById('totalInterest').innerText = '$' + totalInterest.toFixed(2);

            document.getElementById('resultBox').style.display = 'block';
        }
    </script>
</body>
</html>
